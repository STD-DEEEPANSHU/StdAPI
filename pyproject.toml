[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stdapi"
version = "2.3.0"
description = "The unified open-source API platform for AI, media, search, and automation, built to power developers, bots, and real-world applications at scale."
readme = "README.md"
requires-python = ">=3.9"
license = "LGPL-3.0-or-later"

authors = [
  { name = "STD-DEEPANSHU", email = "stddeepanshu@aol.com" }
]

maintainers = [
  { name = "STD-DEEPANSHU", email = "stddeepanshu@aol.com" },
  { name = "TeamStdNetwork", email = "stddeepanshu@aol.com" }
]

keywords = [
  "stdapi",
  "media-downloader",
  "telegram-bot",
  "yt-dlp",
  "ai-agents",
  "mcp-server",
  "model-context-protocol",
  "music-bot",
  "video-downloader",
  "content-moderation",
  "nsfw-detector",
  "temp-mail",
  "search-engine",
  "ffmpeg",
  "automation"
]

dependencies = [
  "aiohttp>=3.9.0",
  "requests>=2.31.0",
  "yt-dlp>=2024.03.10",
  "rich>=13.7.0"
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Communications :: Chat",
  "Topic :: Internet :: WWW/HTTP"
]

[project.optional-dependencies]
cookies = ["browser-cookie3>=0.19.0"]
fastapi = ["fastapi>=0.110.0", "uvicorn>=0.28.0"]
all = [
  "browser-cookie3>=0.19.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "qrcode>=7.4.2",
  "Pillow>=10.0.0"
]

[project.scripts]
stdapi = "stdapi.ui.cli:main"

[project.urls]
Homepage = "https://github.com/STD-DEEPANSHU/StdAPI"
Documentation = "https://github.com/STD-DEEPANSHU/StdAPI#readme"
Tracker = "https://github.com/STD-DEEPANSHU/StdAPI/issues"
Repository = "https://github.com/STD-DEEPANSHU/StdAPI.git"

[tool.setuptools.package-data]
stdapi = ["py.typed"]
